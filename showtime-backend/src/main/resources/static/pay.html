<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShowTime - Payment</title>
<style>
  :root { --bg:#f5f6fa; --card:#ffffff; --text:#1f2430; --muted:#6b7280; --brand:#d32f2f; --ok:#2e7d32; --err:#c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161c; --card:#1e222b; --text:#eceff4; --muted:#9aa3b2; --brand:#ef5350; --ok:#66bb6a; --err:#ef5350; }
  }
  body { margin:0; font-family: system-ui, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text);
         display:flex; justify-content:center; align-items:center; min-height:100vh; }
  .card { background:var(--card); padding:32px 36px; border-radius:14px; max-width:460px; width:90%;
          box-shadow:0 6px 24px rgba(0,0,0,.12); text-align:center; }
  h1 { margin:0 0 4px; color:var(--brand); font-size:26px; }
  .desc { color:var(--muted); margin:6px 0 18px; font-size:14px; }
  .amount { font-size:34px; font-weight:700; margin:8px 0 18px; }
  button { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:12px 28px; font-size:16px; cursor:pointer; }
  .msg { margin-top:18px; font-size:16px; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  .hint { margin-top:22px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<div class="card">
  <h1>ShowTime</h1>
  <div class="desc" id="desc"></div>
  <div class="amount" id="amount"></div>
  <button id="payBtn">Pay now</button>
  <div class="msg" id="msg"></div>
  <div class="hint">TEST MODE &middot; use UPI id <b>success@razorpay</b> or card 4111 1111 1111 1111 (any future expiry, any CVV).</div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const orderId = q.get('orderId');
  const amountPaise = parseInt(q.get('amount') || '0', 10);
  document.getElementById('desc').textContent = q.get('desc') || '';
  document.getElementById('amount').textContent = '\u20B9' + (amountPaise / 100).toFixed(2);
  const msg = document.getElementById('msg');
  const btn = document.getElementById('payBtn');

  function show(text, cls) { msg.textContent = text; msg.className = 'msg ' + cls; }

  async function post(url, body) {
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  }

  function openCheckout() {
    if (!orderId || !q.get('key')) { show('Invalid payment link.', 'err'); return; }
    const rzp = new Razorpay({
      key: q.get('key'),
      amount: amountPaise,
      currency: 'INR',
      name: 'ShowTime',
      description: q.get('desc') || 'Movie tickets',
      order_id: orderId,
      prefill: { name: q.get('name') || '', email: q.get('email') || '' },
      theme: { color: '#d32f2f' },
      handler: async function (r) {
        show('Verifying payment...', '');
        try {
          const out = await post('/api/payments/verify', {
            orderId: r.razorpay_order_id, paymentId: r.razorpay_payment_id, signature: r.razorpay_signature });
          btn.style.display = 'none';
          show(out.message + ' You can close this tab and return to the ShowTime app.', out.status === 'CONFIRMED' ? 'ok' : 'err');
        } catch (e) { show('Verification failed: ' + e.message, 'err'); }
      },
      modal: { ondismiss: function () { show('Payment not completed. Click "Pay now" to try again, or return to the app.', 'err'); } }
    });
    rzp.on('payment.failed', function (resp) {
      const reason = (resp.error && resp.error.description) || 'Payment failed';
      show(reason + ' - you can try again.', 'err');
      post('/api/payments/failed', { orderId: orderId, reason: reason }).catch(() => {});
    });
    rzp.open();
  }

  btn.addEventListener('click', openCheckout);
  window.addEventListener('load', function () { setTimeout(openCheckout, 400); });
</script>
</body>
</html>
